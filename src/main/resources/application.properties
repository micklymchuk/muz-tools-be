spring.application.name=muz-tools-be
server.port=${PORT:8080}
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age-seconds=3600
app.youtube-wav.storage-root=${YOUTUBE_WAV_STORAGE_ROOT:/tmp/youtube-wav}
app.youtube-wav.yt-dlp-command=${YT_DLP_COMMAND:yt-dlp}
app.youtube-wav.ffmpeg-command=${FFMPEG_COMMAND:ffmpeg}
app.youtube-wav.download-timeout-seconds=${YOUTUBE_WAV_DOWNLOAD_TIMEOUT_SECONDS:600}
app.youtube-wav.transcode-timeout-seconds=${YOUTUBE_WAV_TRANSCODE_TIMEOUT_SECONDS:600}
app.youtube-wav.sample-rate=${YOUTUBE_WAV_SAMPLE_RATE:44100}
app.youtube-wav.channels=${YOUTUBE_WAV_CHANNELS:2}
