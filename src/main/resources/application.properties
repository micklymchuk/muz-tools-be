spring.application.name=muz-tools-be
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${APP_CORS_MAX_AGE_SECONDS:3600}
app.youtube-wav.storage-root=${YOUTUBE_WAV_STORAGE_ROOT:/tmp/youtube-wav}
app.youtube-wav.yt-dlp-command=${YT_DLP_COMMAND:yt-dlp}
app.youtube-wav.yt-dlp-js-runtimes=${YT_DLP_JS_RUNTIMES:}
app.youtube-wav.yt-dlp-extractor-args=${YT_DLP_EXTRACTOR_ARGS:}
app.youtube-wav.yt-dlp-cookies-file=${YT_DLP_COOKIES_FILE:}
app.youtube-wav.yt-dlp-sleep-requests-seconds=${YT_DLP_SLEEP_REQUESTS_SECONDS:0}
app.youtube-wav.yt-dlp-sleep-interval-seconds=${YT_DLP_SLEEP_INTERVAL_SECONDS:0}
app.youtube-wav.yt-dlp-max-sleep-interval-seconds=${YT_DLP_MAX_SLEEP_INTERVAL_SECONDS:0}
app.youtube-wav.download-timeout-seconds=${YOUTUBE_WAV_DOWNLOAD_TIMEOUT_SECONDS:600}
