services:
  - type: web
    name: muz-tools-be
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/tools/youtube-to-wav/capabilities
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: YOUTUBE_WAV_STORAGE_ROOT
        value: /tmp/youtube-wav
